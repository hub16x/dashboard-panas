<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Feedback</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    :root {
      --accent-color: #c0622f;
      --bg-dark: #1a1008;
      --glass-bg: rgba(255, 235, 200, 0.05);
      --glass-border: rgba(255, 235, 200, 0.12);
    }

    body {
      height: 100vh;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f0e0c8;
      overflow: hidden;
      position: relative;
      flex-direction: column;
      gap: 30px;
    }

    /* Warm overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(20, 10, 4, 0.55);
      z-index: 0;
      pointer-events: none;
    }

    /* Title */
    h1 {
      font-size: 5rem;
      font-weight: 700;
      text-align: center;
      z-index: 1;
      position: relative;
      animation: float 6s ease-in-out infinite;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2), 0 0 20px rgba(192, 98, 47, 0.3);
    }

    @keyframes float {
      0% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-15px)
      }

      100% {
        transform: translateY(0)
      }
    }

    /* Settings container */
    .feedback-container {
      z-index: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      background: rgba(0, 0, 0, 0.4);
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 500px;
      border: 1px solid var(--glass-border);
    }

    .feedback-form {
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: 15px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .input-group label {
      font-size: 1.1rem;
      font-weight: 500;
      color: #f0e0c8;
    }

    .input-group input,
    .input-group textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 235, 200, 0.05);
      color: #f0e0c8;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .input-group input:focus,
    .input-group textarea:focus {
      border-color: var(--accent-color);
    }

    .input-group textarea {
      resize: none;
      height: 100px;
    }

    .send-btn {
      padding: 12px;
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.3s ease, transform 0.1s ease;
    }

    .send-btn:hover {
      opacity: 0.9;
    }

    .send-btn:active {
      transform: scale(0.98);
    }

    #status-msg {
      font-size: 0.95rem;
      text-align: center;
      min-height: 20px;
    }

    /* Footer */
    footer {
      position: absolute;
      bottom: 20px;
      display: flex;
      gap: 30px;
      font-size: 1.5rem;
      align-items: center;
      z-index: 1;
      flex-wrap: wrap;
      justify-content: center;
    }

    footer span {
      display: flex;
      align-items: center;
      position: relative;
      padding: 0 6px;
    }

    footer>span:not(:last-child)::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 1px;
      height: 60%;
      background: rgba(255, 255, 255, 0.3);
    }

    a {
      color: #f0e0c8;
      text-decoration: none
    }

    a:hover {
      text-decoration: underline
    }

    /* Clock */
    #time {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .seconds {
      color: rgba(240, 224, 200, 0.4);
      font-weight: 400;
      margin-left: -5px;
    }

    /* Battery */
    .battery {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .battery svg {
      width: 24px;
      height: 24px;
      stroke: #f0e0c8;
    }

    @media (max-width:600px) {
      footer {
        flex-direction: column;
        gap: 12px;
        bottom: 10px;
        font-size: 1.1rem
      }

      footer span:not(:last-child)::after {
        display: none
      }

      h1 {
        font-size: 3rem
      }

      .feedback-container {
        width: 90%;
        padding: 20px
      }
    }
  </style>
</head>

<body>
  <h1>Comentarios</h1>

  <div class="feedback-container">
    <form class="feedback-form" id="discord-form">
      <div class="input-group">
        <label for="username">Nombre (si no quiere poner, ponga "-")</label>
        <input type="text" id="username" placeholder="Tu nombre" required maxlength="30">
      </div>
      <div class="input-group">
        <label for="comment">Opinión</label>
        <textarea id="comment" placeholder="Escribe aquí tu opinión..." required maxlength="500"></textarea>
      </div>
      <button type="submit" class="send-btn" id="submit-btn">Enviar comentario</button>
      <div id="status-msg"></div>
    </form>
  </div>

  <footer>
    <span id="time">--:<span class="seconds">--</span></span>

    <span class="battery">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect>
        <line x1="23" y1="13" x2="23" y2="11"></line>
      </svg>
      <span id="battery-text">--%</span>
    </span>
  </footer>

  <script>
    const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1548253399873622069/sU_oLiv2rU2YDUadYAGC8Kz_4gNmKyTwXX0j1zShRIoE5SH6WNpLkQSD_BPy_oKwhKeX';

    document.getElementById('discord-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const comment = document.getElementById('comment').value.trim();
      const statusMsg = document.getElementById('status-msg');
      const submitBtn = document.getElementById('submit-btn');

      if (!username || !comment) return;

      submitBtn.disabled = true;
      statusMsg.style.color = '#f0e0c8';
      statusMsg.textContent = 'Enviando...';

      // Formato del mensaje para Discord
      const payload = {
        embeds: [{
          title: "💬 Nuevo Comentario Recibido",
          color: 12608047, // Color hexadecimal #c0622f convertido a entero
          fields: [
            { name: "Usuario", value: username, inline: true },
            { name: "Comentario", value: comment }
          ],
          timestamp: new Date().toISOString()
        }]
      };

      try {
        const response = await fetch(DISCORD_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          statusMsg.style.color = '#7bc67b';
          statusMsg.textContent = '¡Gracias! Tu comentario ha sido enviado.';
          document.getElementById('discord-form').reset();
        } else {
          throw new Error('Error al enviar');
        }
      } catch (error) {
        statusMsg.style.color = '#e57373';
        statusMsg.textContent = 'Error al enviar el comentario. Inténtalo de nuevo.';
      } finally {
        submitBtn.disabled = false;
      }
    });

    // Reloj
    function updateTime() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      const ms = String(now.getMilliseconds()).padStart(3, '0').slice(0, 2);

      document.getElementById('time').innerHTML = `${hh}:${mm}:<span class="seconds">${ss}.${ms}</span>`;
    }

    setInterval(updateTime, 16.66667);
    updateTime();

    // Batería
    const batteryText = document.getElementById('battery-text');
    if (navigator.getBattery) {
      navigator.getBattery().then(b => {
        function upd() { batteryText.textContent = `${Math.round(b.level * 100)}%`; }
        b.addEventListener('levelchange', upd);
        b.addEventListener('chargingchange', upd);
        upd();
      });
    } else { batteryText.textContent = 'N/A'; }
  </script>
</body>

</html>
