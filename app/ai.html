<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>

  <!-- Fuente Inter & Remix Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0e0d0c;
      --bg-sidebar: #141210;
      --bg-surface: #1b1816;
      --bg-surface-hover: #26221f;
      --border: rgba(192, 98, 47, 0.18);
      --border-hover: rgba(192, 98, 47, 0.35);
      
      --accent: #c0622f;
      --accent2: #e07a3c;
      --accent-glow: rgba(192, 98, 47, 0.15);
      
      --text: #f3efe9;
      --text-muted: #8e837a;
      --bubble-ai: #171513;
      --bubble-user: #261f1a;
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      height: 100dvh;
      display: flex;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    #sidebarOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(3px);
      z-index: 40;
    }

    aside#sidebar {
      width: 270px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 50;
      transition: transform 0.25s ease;
    }

    .sidebar-header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.3px;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 16px;
    }

    .new-chat-btn {
      margin: 14px 16px 8px;
      padding: 10px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .new-chat-btn:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-hover);
    }

    .sidebar-section-title {
      padding: 14px 18px 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      font-weight: 600;
    }

    #recentList {
      flex: 1;
      overflow-y: auto;
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .sidebar-item {
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s;
    }

    .sidebar-item:hover {
      background: var(--bg-surface);
      color: var(--text);
    }

    .sidebar-item.active {
      background: var(--bg-surface-hover);
      color: var(--accent2);
      font-weight: 500;
      border: 1px solid var(--border);
    }

    /* ── MAIN AREA ── */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
    }

    /* Topbar */
    .topbar {
      height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: rgba(14, 13, 12, 0.7);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .icon-btn:hover {
      background: var(--bg-surface);
      border-color: var(--border);
      color: var(--text);
    }

    #sidebarToggle {
      display: none;
    }

    #topbarTitle {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 45vw;
    }

    /* Chat Area */
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      scroll-behavior: smooth;
    }

    .chat-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── WELCOME SCREEN ── */
    #welcomeScreen {
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 650px;
      padding: 20px 0;
    }

    .welcome-logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), #e8864d);
      box-shadow: 0 0 25px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: white;
      margin-bottom: 16px;
    }

    .welcome-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .welcome-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* Mode selector chips */
    .mode-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 12px;
    }

    .mode-chip {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-chip:hover {
      border-color: var(--border-hover);
      color: var(--text);
    }

    .mode-chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    #modeDesc {
      font-size: 12px;
      color: var(--text-muted);
      min-height: 18px;
      margin-bottom: 26px;
    }

    /* Suggestion pills */
    .suggestions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      width: 100%;
    }

    .suggestion-pill {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s;
    }

    .suggestion-pill:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .suggestion-pill i {
      color: var(--accent2);
    }

    /* ── MESSAGES ── */
    #messageWrap {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .msg.user .msg-header {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .msg.ai .msg-avatar {
      background: var(--accent);
      color: #fff;
    }

    .msg.user .msg-avatar {
      background: #433932;
      color: #f2e9e1;
    }

    .msg-name {
      font-weight: 600;
      color: var(--text);
    }

    .msg-model {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-surface);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .msg-body {
      display: flex;
      width: 100%;
    }

    .msg.user .msg-body {
      justify-content: flex-end;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 14.5px;
      line-height: 1.6;
      max-width: 88%;
      word-break: break-word;
    }

    .msg.ai .bubble {
      background: var(--bubble-ai);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .msg.user .bubble {
      background: var(--bubble-user);
      border: 1px solid rgba(192, 98, 47, 0.3);
      color: #fff;
    }

    .thinking-dots span {
      animation: blink 1.2s infinite ease-in-out;
      font-weight: 700;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }

    /* ── INPUT DOCK ── */
    .input-dock {
      padding: 0 16px 16px;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    .input-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      transition: border-color 0.2s;
    }

    .input-box:focus-within {
      border-color: var(--border-hover);
    }

    #imagePreview {
      position: relative;
      align-self: flex-start;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    #previewImg {
      max-height: 80px;
      display: block;
    }

    #removeImg {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.7);
      border: none;
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
    }

    textarea#msgInput {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      resize: none;
      width: 100%;
      line-height: 1.5;
      max-height: 180px;
      padding: 4px 2px;
    }

    textarea#msgInput::placeholder {
      color: var(--text-muted);
    }

    .input-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding-top: 6px;
    }

    .action-group-left {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .action-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      padding: 6px 9px;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .action-btn:hover {
      background: var(--bg-surface-hover);
      color: var(--text);
    }

    #sendBtn {
      background: var(--accent);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    #sendBtn:hover:not(:disabled) {
      background: var(--accent2);
      transform: scale(1.05);
    }

    #sendBtn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      aside#sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
      }
      aside#sidebar.open {
        transform: translateX(0);
      }
      #sidebarOverlay.visible {
        display: block;
      }
      #sidebarToggle {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <!-- Overlay para móviles -->
  <div id="sidebarOverlay"></div>

  <!-- Barra lateral -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon"><i class="ri-robot-2-line"></i></div>
        <span>AI Studio</span>
      </div>
    </div>
    
    <button class="new-chat-btn" id="newChatBtn">
      <i class="ri-add-line"></i>
      <span>Nuevo chat</span>
    </button>

    <div class="sidebar-section-title">Historial reciente</div>
    <div id="recentList"></div>
  </aside>

  <!-- Contenedor Principal -->
  <main class="main-content">
    
    <!-- Barra Superior -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="sidebarToggle" title="Alternar menú">
          <i class="ri-menu-line"></i>
        </button>
        <span id="topbarTitle">Nueva conversación</span>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="copyBtn" title="Copiar última respuesta">
          <i class="ri-file-copy-line"></i>
        </button>
        <button class="icon-btn" id="clearBtn" title="Limpiar conversación actual">
          <i class="ri-delete-bin-line"></i>
        </button>
      </div>
    </header>

    <!-- Cuerpo del Chat -->
    <section class="chat-body" id="chatBody">
      <div class="chat-container">

        <!-- Pantalla de bienvenida -->
        <div id="welcomeScreen">
          <div class="welcome-logo">
            <i class="ri-sparkling-fill"></i>
          </div>
          <h1 class="welcome-title">¿En qué puedo ayudarte hoy?</h1>
          <p class="welcome-desc">Selecciona un modo de trabajo y comienza a chatear.</p>

          <div class="mode-chips">
            <button class="mode-chip active" data-mode="normal">General</button>
            <button class="mode-chip" data-mode="code">Código</button>
            <button class="mode-chip" data-mode="writing">Redacción</button>
            <button class="mode-chip" data-mode="math">Matemáticas</button>
            <button class="mode-chip" data-mode="algebra">Álgebra</button>
          </div>

          <div id="modeDesc">Asistente general → cualquier consulta</div>

          <div class="suggestions">
            <button class="suggestion-pill" data-text="Explícame cómo funciona un motor de renderizado web en términos sencillos">
              <span>¿Cómo funciona un motor web?</span>
              <i class="ri-arrow-right-line"></i>
            </button>
            <button class="suggestion-pill" data-text="Escribe una función en TypeScript para invertir un string y validar palindromos">
              <span>Función de palíndromos en TS</span>
              <i class="ri-code-line"></i>
            </button>
            <button class="suggestion-pill" data-text="Resuelve paso a paso la ecuación cuadrática: 2x² + 5x - 3 = 0">
              <span>Resolver: 2x² + 5x - 3 = 0</span>
              <i class="ri-function-line"></i>
            </button>
          </div>
        </div>

        <!-- Contenedor de mensajes -->
        <div id="messageWrap" style="display: none;"></div>

      </div>
    </section>

    <!-- Dock de Entrada -->
    <div class="input-dock">
      <div class="input-box">
        
        <!-- Previsualización de imagen adjunta -->
        <div id="imagePreview" style="display: none;">
          <img id="previewImg" src="" alt="Vista previa">
          <button id="removeImg" title="Eliminar archivo"><i class="ri-close-line"></i></button>
        </div>

        <textarea id="msgInput" rows="1" placeholder="Escribe tu mensaje para la IA..."></textarea>
        
        <input type="file" id="imageFileInput" accept="image/*" style="display: none;" />

        <div class="input-actions">
          <div class="action-group-left">
            <button class="action-btn" id="attachBtn" title="Adjuntar imagen">
              <i class="ri-image-add-line"></i>
            </button>
            <button class="action-btn" id="screenBtn" title="Compartir pantalla">
              <i class="ri-computer-line"></i>
            </button>
            <button class="action-btn" id="clearInputBtn" title="Vaciar texto">
              <i class="ri-eraser-line"></i>
            </button>
          </div>
          <button id="sendBtn" disabled title="Enviar">
            <i class="ri-arrow-up-line"></i>
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- ── TU CÓDIGO JAVASCRIPT INTACTO ── -->
  <script>
  // ── STATE ──────────────────────────────────────────────────────────────────
  let currentMode = 'normal';
  let messageHistory = [];
  let isFetching = false;
  let lastAIResponse = '';
  let activeConvoId = null;

  const STORAGE_KEY = 'ratai_convos';
  const ACTIVE_KEY  = 'ratai_active_id';
  const MAX_CONVOS  = 20;

  const modeDescriptions = {
    normal:  'General assistant → anything goes',
    code:    'Code assistant → optimized for programming',
    writing: 'Writing assistant → essays, stories, editing',
    math:    'Math assistant → step-by-step with LaTeX',
    algebra: 'Algebra tutor → full step-by-step solutions'
  };

  const modeSystemPrompts = {
    normal:
      'You are a helpful, friendly, and knowledgeable general-purpose assistant. Answer clearly and concisely. Adapt your tone to the question — casual for casual questions, thorough for complex ones.',
    code:
      'You are an elite software engineer and coding assistant.\nSTRICT RULES:\n1. Always write COMPLETE, RUNNABLE code. Never use placeholder comments like "// ... rest of code".\n2. Put ALL code inside proper fenced code blocks with the correct language tag.\n3. If multiple files are needed, show each one in its own labeled code block.\n4. After the code, briefly explain what it does, key design decisions, and how to run it.\n5. Handle edge cases and errors properly in the code itself.\n6. Use modern, idiomatic syntax.\n7. If debugging, identify the exact bug first, then show the full fixed code.\n8. Keep explanations concise — code first, explanation second.',
    writing:
      "You are an expert writer, editor, and creative collaborator.\nGUIDELINES:\n1. Prioritize clear, vivid, engaging language.\n2. Match the tone the user requests — formal, casual, literary, conversational, persuasive, etc.\n3. For creative writing: show, don't tell.\n4. For editing: explain your changes. Preserve the author's voice.\n5. Always offer to iterate or adjust tone/style if needed.",
    math:
      'You are an expert mathematics tutor.\nSTRICT RULES:\n1. Always show your work step-by-step.\n2. Use LaTeX notation: inline as $...$ and display as $$...$$.\n3. Explain each step in plain language after writing it mathematically.\n4. Check your answer at the end where possible.',
    algebra:
      'You are an expert algebra tutor.\nSTRICT RULES:\n1. Show every algebraic manipulation step-by-step with clear justification.\n2. Use LaTeX notation: inline as $...$ and display as $$...$$.\n3. Always verify solutions by substituting back into the original equation.\n4. If multiple solutions exist, find all of them.'
  };

  const API_ENDPOINT = 'https://ai.4texasplayz4.workers.dev/';

  // ── DOM REFS ───────────────────────────────────────────────────────────────
  const chatBody      = document.getElementById('chatBody');
  const welcomeScreen = document.getElementById('welcomeScreen');
  const messageWrap   = document.getElementById('messageWrap');
  const msgInput      = document.getElementById('msgInput');
  const sendBtn       = document.getElementById('sendBtn');
  const modeDesc      = document.getElementById('modeDesc');
  const newChatBtn    = document.getElementById('newChatBtn');
  const sidebar       = document.getElementById('sidebar');
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarOverlay= document.getElementById('sidebarOverlay');
  const recentList    = document.getElementById('recentList');

  // ── LOCALSTORAGE HELPERS ───────────────────────────────────────────────────
  function loadConvos() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function saveConvos(convos) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(convos));
  }

  function saveCurrentConvo(title) {
    if (!activeConvoId) return;
    let convos = loadConvos();
    const idx = convos.findIndex(c => c.id === activeConvoId);
    const entry = { id: activeConvoId, title: title || 'New conversation', messages: messageHistory.slice() };
    if (idx >= 0) {
      convos[idx] = entry;
    } else {
      convos.unshift(entry);
      if (convos.length > MAX_CONVOS) convos = convos.slice(0, MAX_CONVOS);
    }
    saveConvos(convos);
    localStorage.setItem(ACTIVE_KEY, activeConvoId);
    renderRecentList();
  }

  function renderRecentList() {
    recentList.innerHTML = '';
    const convos = loadConvos();
    if (convos.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'sidebar-item';
      empty.style.color = 'var(--text-muted)';
      empty.style.fontSize = '12px';
      empty.textContent = 'No hay chats guardados';
      recentList.appendChild(empty);
      return;
    }
    convos.forEach(convo => {
      const item = document.createElement('div');
      item.className = 'sidebar-item' + (convo.id === activeConvoId ? ' active' : '');
      item.title = convo.title;
      item.textContent = convo.title;
      item.addEventListener('click', () => loadConvo(convo.id));
      recentList.appendChild(item);
    });
  }

  function loadConvo(id) {
    const convos = loadConvos();
    const convo = convos.find(c => c.id === id);
    if (!convo) return;

    activeConvoId = id;
    messageHistory = convo.messages.slice();
    lastAIResponse = '';

    // Rebuild UI
    messageWrap.innerHTML = '';
    if (messageHistory.length === 0) {
      messageWrap.style.display = 'none';
      welcomeScreen.style.display = '';
    } else {
      welcomeScreen.style.display = 'none';
      messageWrap.style.display = '';
      // Re-render messages from history
      messageHistory.forEach(msg => {
        if (msg.role === 'user') {
          appendUserMsgFromHistory(msg.content);
        } else {
          const html = formatResponse(msg.content);
          const d = document.createElement('div');
          d.className = 'msg ai';
          d.innerHTML = `
            <div class="msg-header">
              <div class="msg-avatar"><i class="ri-robot-2-line"></i></div>
              <span class="msg-name">Rat AI</span>
              <span class="msg-model">llama-3.3-70b-versatile</span>
            </div>
            <div class="msg-body"><div class="bubble">${html}</div></div>`;
          messageWrap.appendChild(d);
          lastAIResponse = msg.content;
        }
      });
    }

    document.getElementById('topbarTitle').textContent = convo.title;
    localStorage.setItem(ACTIVE_KEY, id);
    renderRecentList();

    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('visible');

    chatBody.scrollTo({ top: chatBody.scrollHeight, behavior: 'smooth' });
  }

  function appendUserMsgFromHistory(text) {
    const d = document.createElement('div');
    d.className = 'msg user';
    const escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    d.innerHTML = `
      <div class="msg-header">
        <div class="msg-avatar"><i class="ri-user-line"></i></div>
        <span class="msg-name">You</span>
        <span class="msg-model" style="visibility:hidden"></span>
      </div>
      <div class="msg-body"><div class="bubble">${escaped}</div></div>`;
    messageWrap.appendChild(d);
  }

  // ── INIT: load saved convos on page load ───────────────────────────────────
  (function init() {
    renderRecentList();
    const savedId = localStorage.getItem(ACTIVE_KEY);
    if (savedId) {
      const convos = loadConvos();
      const convo = convos.find(c => c.id === savedId);
      if (convo && convo.messages.length > 0) {
        loadConvo(savedId);
        return;
      }
    }
    // Start fresh
    activeConvoId = Date.now();
  })();

  // ── IMAGE ATTACH ───────────────────────────────────────────────────────────
  let attachedFile = null;

  document.getElementById('attachBtn').addEventListener('click', () => {
    document.getElementById('imageFileInput').click();
  });

  document.getElementById('imageFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    attachedFile = file;
    const url = URL.createObjectURL(file);
    document.getElementById('previewImg').src = url;
    document.getElementById('imagePreview').style.display = '';
    sendBtn.disabled = isFetching;
  });

  document.getElementById('removeImg').addEventListener('click', () => {
    attachedFile = null;
    document.getElementById('imageFileInput').value = '';
    document.getElementById('imagePreview').style.display = 'none';
    document.getElementById('previewImg').src = '';
    sendBtn.disabled = !msgInput.value.trim() || isFetching;
  });

  // ── SCREEN CAPTURE ─────────────────────────────────────────────────────────
  let screenStream = null;
  const screenBtn = document.getElementById('screenBtn');

  screenBtn.addEventListener('click', async () => {
    if (screenStream) {
      screenStream.getTracks().forEach(t => t.stop());
      screenStream = null;
      screenBtn.style.color = '';
      screenBtn.style.borderColor = '';
      screenBtn.title = 'Share screen';
      return;
    }
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
      screenBtn.style.color = '#4ade80';
      screenBtn.style.borderColor = '#4ade80';
      screenBtn.title = 'Screen sharing on — click to stop';
      screenStream.getVideoTracks()[0].addEventListener('ended', () => {
        screenStream = null;
        screenBtn.style.color = '';
        screenBtn.style.borderColor = '';
        screenBtn.title = 'Share screen';
      });
    } catch (e) {
      // User cancelled
    }
  });

  async function captureScreenshot() {
    if (!screenStream) return null;
    const video = document.createElement('video');
    video.srcObject = screenStream;
    video.muted = true;
    await new Promise(r => { video.onloadedmetadata = r; video.play(); });
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    video.pause();
    return await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  }

  // ── SIDEBAR TOGGLE (mobile) ────────────────────────────────────────────────
  sidebarToggle.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    sidebarOverlay.classList.toggle('visible');
  });
  sidebarOverlay.addEventListener('click', () => {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('visible');
  });

  // ── TOPBAR BUTTONS ─────────────────────────────────────────────────────────
  document.getElementById('clearBtn').addEventListener('click', () => {
    if (!messageHistory.length) return;
    messageHistory = [];
    messageWrap.innerHTML = '';
    messageWrap.style.display = 'none';
    welcomeScreen.style.display = '';
    document.getElementById('topbarTitle').textContent = 'Nueva conversación';
    activeConvoId = Date.now();
    renderRecentList();
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    if (!lastAIResponse) return;
    navigator.clipboard.writeText(lastAIResponse).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.innerHTML = '<i class="ri-check-line"></i>';
      setTimeout(() => { btn.innerHTML = '<i class="ri-file-copy-line"></i>'; }, 1500);
    });
  });

  document.getElementById('clearInputBtn').addEventListener('click', () => {
    msgInput.value = '';
    msgInput.style.height = 'auto';
    sendBtn.disabled = true;
    msgInput.focus();
  });

  // ── MODE CHIPS ─────────────────────────────────────────────────────────────
  document.querySelectorAll('.mode-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.mode-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentMode = chip.dataset.mode;
      modeDesc.textContent = modeDescriptions[currentMode];
      msgInput.placeholder = `Pregúntale a Rat AI (${chip.textContent.trim()})...`;
      msgInput.focus();
    });
  });

  // ── SUGGESTION PILLS ───────────────────────────────────────────────────────
  document.querySelectorAll('.suggestion-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      msgInput.value = pill.dataset.text;
      msgInput.dispatchEvent(new Event('input'));
      msgInput.focus();
    });
  });

  // ── INPUT ──────────────────────────────────────────────────────────────────
  msgInput.addEventListener('input', () => {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 180) + 'px';
    sendBtn.disabled = (!msgInput.value.trim() && !attachedFile) || isFetching;
  });

  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendBtn.click();
    }
  });

  // ── NEW CHAT ───────────────────────────────────────────────────────────────
  newChatBtn.addEventListener('click', () => {
    messageHistory = [];
    lastAIResponse = '';
    messageWrap.innerHTML = '';
    messageWrap.style.display = 'none';
    welcomeScreen.style.display = '';
    activeConvoId = Date.now();
    document.getElementById('topbarTitle').textContent = 'Nueva conversación';
    localStorage.setItem(ACTIVE_KEY, activeConvoId);
    renderRecentList();
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('visible');
  });

  // ── SEND ───────────────────────────────────────────────────────────────────
  sendBtn.addEventListener('click', async () => {
    const text = msgInput.value.trim();
    if ((!text && !attachedFile) || isFetching) return;

    // Capture screen frame if screen sharing is active and no file attached
    if (screenStream && !attachedFile) {
      const shot = await captureScreenshot();
      if (shot) attachedFile = new File([shot], 'screenshot.png', { type: 'image/png' });
    }

    welcomeScreen.style.display = 'none';
    messageWrap.style.display = '';

    appendUserMsg(text, attachedFile);
    messageHistory.push({ role: 'user', content: text || '[image]' });
    const fileToSend = attachedFile;
    attachedFile = null;
    document.getElementById('imageFileInput').value = '';
    document.getElementById('imagePreview').style.display = 'none';
    document.getElementById('previewImg').src = '';
    msgInput.value = '';
    msgInput.style.height = 'auto';
    sendBtn.disabled = true;
    isFetching = true;

    const isFirstMsg = messageHistory.length === 1;
    if (isFirstMsg && (!fileToSend || text)) {
      setConvoTitle(text, false);
    }

    const thinkEl = appendThinking();

    try {
      const response = await callAI(text, fileToSend);
      thinkEl.remove();
      appendAIMsg(response);
      const plainResponse = response.replace(/<[^>]+>/g, '');
      lastAIResponse = plainResponse;
      messageHistory.push({ role: 'assistant', content: plainResponse });

      // If first message was image-only, summarize AI's description as the title
      if (messageHistory.length === 2 && !text && fileToSend) {
        await setConvoTitleFromResponse(plainResponse);
      }

      // Persist to localStorage after each exchange
      const currentTitle = document.getElementById('topbarTitle').textContent;
      saveCurrentConvo(currentTitle);

    } catch (err) {
      thinkEl.remove();
      appendAIMsg('⚠️ ' + (err.message || 'Something went wrong.'));
    }

    isFetching = false;
    sendBtn.disabled = !msgInput.value.trim();
    chatBody.scrollTo({ top: chatBody.scrollHeight, behavior: 'smooth' });
  });

  // ── CONVO TITLE ────────────────────────────────────────────────────────────
  async function setConvoTitle(text, imageOnly) {
    const topbar = document.getElementById('topbarTitle');

    if (imageOnly || !text) {
      topbar.textContent = '📷 Image';
      return;
    }

    if (text.length <= 40) {
      topbar.textContent = text;
      return;
    }

    topbar.textContent = 'Thinking…';
    try {
      const formData = new FormData();
      formData.append('prompt',
        `Summarize the following message into a short conversation title of at most 5 words. Reply with ONLY the title, no punctuation at the end, no quotes.\n\nMessage: ${text}`
      );
      const res = await fetch(API_ENDPOINT, { method: 'POST', body: formData, credentials: 'omit' });
      if (res.ok) {
        const data = await res.json();
        const title = (data.response || data.text || '').trim().slice(0, 50) || text.slice(0, 40) + '…';
        topbar.textContent = title;
        return;
      }
    } catch {}

    topbar.textContent = text.slice(0, 40) + '…';
  }

  // ── CONVO TITLE FROM AI RESPONSE (image-only) ─────────────────────────────
  async function setConvoTitleFromResponse(aiText) {
    const topbar = document.getElementById('topbarTitle');
    topbar.textContent = 'Summarizing…';
    try {
      const formData = new FormData();
      formData.append('prompt',
        `Summarize what this image contains in 4 words or less. Reply with ONLY the summary, no punctuation, no quotes.\n\nImage description: ${aiText.slice(0, 400)}`
      );
      const res = await fetch(API_ENDPOINT, { method: 'POST', body: formData, credentials: 'omit' });
      if (res.ok) {
        const data = await res.json();
        const title = (data.response || data.text || '').trim().slice(0, 50) || '📷 Image';
        topbar.textContent = title;
        return;
      }
    } catch {}
    topbar.textContent = '📷 Image';
  }

  // ── API ────────────────────────────────────────────────────────────────────
  async function callAI(userText, imageFile = null) {
    const systemPrompt = modeSystemPrompts[currentMode] || modeSystemPrompts.normal;

    let context = '';
    for (const msg of messageHistory) {
      context += `${msg.role === 'user' ? 'User' : 'Assistant'}: ${msg.content}\n\n`;
    }

    const prompt = imageFile && !userText
      ? 'Describe and analyze what you see in detail.'
      : `${systemPrompt}\n\n---\nConversation context:\n${context}---\n\n\nUser: ${userText}`;

    const formData = new FormData();
    formData.append('prompt', prompt);
    if (imageFile) formData.append('images', imageFile);

    const res = await fetch(API_ENDPOINT, { method: 'POST', body: formData, credentials: 'omit' });
    if (!res.ok) throw new Error(`API error: ${res.status}`);
    const data = await res.json();
    const text = data.response || data.text || JSON.stringify(data);
    return formatResponse(text);
  }

  // ── FORMAT ─────────────────────────────────────────────────────────────────
  function escapeHTML(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatResponse(text) {
    // 1. Extract code blocks first (protect them from other transforms)
    const codeBlocks = [];
    text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      const idx = codeBlocks.length;
      const label = lang ? lang.toUpperCase() : 'CODE';
      codeBlocks.push(
        `<div style="margin:8px 0;border-radius:8px;overflow:hidden;border:1px solid rgba(192,98,47,0.25)">` +
        `<div style="background:#2e1c0a;padding:6px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(192,98,47,0.25)">` +
        `<span style="font-size:11px;color:#9a7a60;font-family:'Courier New',monospace;letter-spacing:0.5px">${label}</span>` +
        `<button onclick="navigator.clipboard.writeText(this.dataset.code);this.textContent='Copied!';setTimeout(()=>this.textContent='Copy',1500)" ` +
        `data-code="${escapeHTML(code.trim()).replace(/"/g,'&quot;')}" ` +
        `style="background:none;border:1px solid rgba(192,98,47,0.3);color:#9a7a60;font-size:11px;padding:2px 8px;border-radius:4px;cursor:pointer">Copy</button>` +
        `</div>` +
        `<pre style="background:#1a1008;padding:12px 14px;overflow-x:auto;margin:0;font-size:13px;line-height:1.5"><code style="font-family:'Courier New',monospace;color:#f0e0c8">${escapeHTML(code.trim())}</code></pre>` +
        `</div>`
      );
      return `\x00CODE${idx}\x00`;
    });

    // 2. Escape HTML in non-code parts
    text = text.replace(/[^\x00]/g, c => {
      if (c === '&') return '&amp;';
      if (c === '<') return '&lt;';
      if (c === '>') return '&gt;';
      return c;
    });

    // 3. Process line by line for block elements
    const lines = text.split('\n');
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];

      // Headings
      const h3 = line.match(/^### (.+)/);
      const h2 = line.match(/^## (.+)/);
      const h1 = line.match(/^# (.+)/);
      if (h1) { out.push(`<h2 style="font-size:1.3em;font-weight:700;margin:14px 0 6px;color:var(--text)">${h1[1]}</h2>`); i++; continue; }
      if (h2) { out.push(`<h3 style="font-size:1.15em;font-weight:700;margin:12px 0 5px;color:var(--text)">${h2[1]}</h3>`); i++; continue; }
      if (h3) { out.push(`<h4 style="font-size:1.05em;font-weight:700;margin:10px 0 4px;color:var(--text)">${h3[1]}</h4>`); i++; continue; }

      // Horizontal rule
      if (/^---+$/.test(line.trim())) { out.push('<hr style="border:none;border-top:1px solid rgba(192,98,47,0.2);margin:12px 0">'); i++; continue; }

      // Bullet lists (- or * or + or •)
      if (/^[\-\*\+•] /.test(line)) {
        out.push('<ul style="margin:6px 0 6px 18px;padding:0;list-style:disc">');
        while (i < lines.length && /^[\-\*\+•] /.test(lines[i])) {
          out.push(`<li style="margin:2px 0;color:var(--text)">${inlineFormat(lines[i].replace(/^[\-\*\+•] /, ''))}</li>`);
          i++;
        }
        out.push('</ul>');
        continue;
      }

      // Numbered lists
      if (/^\d+\. /.test(line)) {
        out.push('<ol style="margin:6px 0 6px 18px;padding:0">');
        while (i < lines.length && /^\d+\. /.test(lines[i])) {
          out.push(`<li style="margin:2px 0;color:var(--text)">${inlineFormat(lines[i].replace(/^\d+\. /, ''))}</li>`);
          i++;
        }
        out.push('</ol>');
        continue;
      }

      // Code block placeholder
      if (/\x00CODE\d+\x00/.test(line)) {
        out.push(line.replace(/\x00CODE(\d+)\x00/g, (_, n) => codeBlocks[n]));
        i++; continue;
      }

      // Blank line → spacing
      if (line.trim() === '') { out.push('<div style="height:6px"></div>'); i++; continue; }

      // Normal paragraph line
      out.push(`<p style="margin:3px 0;line-height:1.65">${inlineFormat(line)}</p>`);
      i++;
    }

    return out.join('');
  }

  function inlineFormat(text) {
    text = text.replace(/\x00CODE(\d+)\x00/g, (_, n) => `[code block ${n}]`);
    text = text.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
    text = text.replace(/_(.*?)_/g, '<em>$1</em>');
    text = text.replace(/`([^`]+)`/g, `<code style="background:#2e1c0a;padding:1px 5px;border-radius:4px;font-size:12px;font-family:'Courier New',monospace;color:#f0e0c8">$1</code>`);
    text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:var(--accent2);text-decoration:underline">$1</a>');
    return text;
  }

  // ── MESSAGE BUILDERS ───────────────────────────────────────────────────────
  function appendUserMsg(text, imageFile = null) {
    const d = document.createElement('div');
    d.className = 'msg user';
    const escapedText = text ? text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';
    let bodyContent = '';
    if (imageFile) {
      const url = URL.createObjectURL(imageFile);
      bodyContent += `<img src="${url}" style="max-height:120px;border-radius:6px;display:block;margin-bottom:${text?'6px':'0'}">`;
    }
    if (escapedText) bodyContent += escapedText;
    d.innerHTML = `
      <div class="msg-header">
        <div class="msg-avatar"><i class="ri-user-line"></i></div>
        <span class="msg-name">You</span>
        <span class="msg-model" style="visibility:hidden"></span>
      </div>
      <div class="msg-body"><div class="bubble">${bodyContent}</div></div>`;
    messageWrap.appendChild(d);
    chatBody.scrollTo({ top: chatBody.scrollHeight, behavior: 'smooth' });
  }

  function appendAIMsg(html) {
    const d = document.createElement('div');
    d.className = 'msg ai';
    d.innerHTML = `
      <div class="msg-header">
        <div class="msg-avatar"><i class="ri-robot-2-line"></i></div>
        <span class="msg-name">AI</span>
        <span class="msg-model">llama-3.3-70b-versatile</span>
      </div>
      <div class="msg-body"><div class="bubble">${html}</div></div>`;
    messageWrap.appendChild(d);
    chatBody.scrollTo({ top: chatBody.scrollHeight, behavior: 'smooth' });
  }

  function appendThinking() {
    const d = document.createElement('div');
    d.className = 'msg ai';
    d.innerHTML = `
      <div class="msg-header">
        <div class="msg-avatar"><i class="ri-robot-2-line"></i></div>
        <span class="msg-name">AI</span>
        <span class="msg-model">llama-3.3-70b-versatile</span>
      </div>
      <div class="msg-body"><div class="bubble" style="color:var(--text-muted)">Thinking<span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span></div></div>`;
    messageWrap.appendChild(d);
    chatBody.scrollTo({ top: chatBody.scrollHeight, behavior: 'smooth' });
    return d;
  }
  </script>
</body>
