<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ejercicios de inglés - Fichas interactivas online gratis - Fichas & Examenes</title>
  <style>
    :root {
      --accent-color: #c0622f;
      --bg-dark: #1a1008;
      --glass-bg: rgba(255, 235, 200, 0.05);
      --glass-border: rgba(255, 235, 200, 0.12);
    }

    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f0e0c8;
      overflow: hidden;
      position: relative;
    }

    .bold {
      font-weight: 900;
    }

    /* Warm overlay — lighter at top so rat GIF shows through */
    body::before {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom,
          rgba(20, 10, 4, 0.20) 0%,
          rgba(20, 10, 4, 0.45) 50%,
          rgba(20, 10, 4, 0.65) 100%);
      z-index: 0;
      pointer-events: none;
      content: '';
    }

    /* Title */
    h1 {
      font-size: 7rem;
      font-weight: 700;
      text-align: center;
      z-index: 1;
      position: relative;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2), 0 0 20px rgba(192, 98, 47, 0.3);
    }

    .wave span {
      display: inline-block;
      animation: wave 3.5s ease-in-out infinite;
    }

    @keyframes wave {
      0% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }

      100% {
        transform: translateY(0);
      }
    }

    /* Footer */
    footer {
      position: absolute;
      bottom: 20px;
      display: flex;
      gap: 30px;
      font-size: 1.5rem;
      align-items: center;
      z-index: 1;
      flex-wrap: wrap;
      justify-content: center;
    }

    footer span {
      display: flex;
      align-items: center;
      position: relative;
      padding: 0 6px;
    }

    /* Even spacing */
    footer span:nth-child(1) {
      padding-right: 6px;
    }

    /* time -> first divider */
    footer span:nth-child(2) {
      padding-left: 6px;
      padding-right: 6px;
    }

    /* battery */
    footer span:nth-child(3) {
      padding-left: 6px;
    }

    /* discord left side */

    /* Only add divider lines between top-level footer items */
    footer>span:not(:last-child)::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 1px;
      height: 60%;
      background: rgba(255, 255, 255, 0.3);
    }

    a {
      color: #f0e0c8;
      text-decoration: none
    }

    a:hover {
      text-decoration: underline
    }

    /* Clock */
    #time {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .seconds {
      color: rgba(240, 224, 200, 0.65);
      font-weight: 400;
      margin-left: -5px;
    }

    .ampm {
      color: rgba(240, 224, 200, 0.65);
      font-size: 0.8em;
      margin-left: -8px;
    }

    /* Battery */
    .battery {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .battery svg {
      width: 24px;
      height: 24px;
      stroke: #f0e0c8;
    }

    @media (max-width:600px) {
      footer {
        flex-direction: column;
        gap: 12px;
        bottom: 10px;
        font-size: 1.1rem
      }

      footer span:not(:last-child)::after {
        display: none
      }

      h1 {
        font-size: 4rem
      }
    }
  </style>
</head>

<body>
  <h1 id="wave-title" class="bold">You need JavaScript to run this app</h1>

  <footer>
    <span id="time">--:<span class="seconds">--</span><span class="ampm">--</span></span>

    <span class="battery">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect>
        <line x1="23" y1="13" x2="23" y2="11"></line>

      <span id="battery-text">Loading... %</span>

  </footer>

    // 2. Buscamos el elemento en el HTML
    const miTitulo = document.getElementById('wave-title');

    if (miTitulo) {
      // 3. Calculamos un índice aleatorio del array
      const indiceAleatorio = Math.floor(Math.random() * titulosAlAzar.length);

      // 4. Asignamos el título aleatorio
      miTitulo.textContent = titulosAlAzar[indiceAleatorio];
    }
  </script>

  <script>
    function updateTime() {
      const now = new Date();

      // Horas, minutos y segundos estándar
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');

      // Obtenemos los milisegundos y los limitamos a 2 decimales
      const ms = String(now.getMilliseconds()).padStart(3, '0').slice(0, 2);

      // Renderizamos la hora incluyendo los decimales
      document.getElementById('time').innerHTML = `${hh}:${mm}:<span class="seconds">${ss}.${ms}</span>`;
    }

    // Cambiamos el intervalo a 16.66...ms para que los decimales fluyan con fluidez
    setInterval(updateTime, 16.66667);

    // Ejecución inicial
    updateTime();

    // Battery percentage
    const batteryText = document.getElementById('battery-text');
    if (navigator.getBattery) {
      navigator.getBattery().then(b => {
        function upd() { batteryText.textContent = `${Math.round(b.level * 100)}%`; }
        b.addEventListener('levelchange', upd);
        b.addEventListener('chargingchange', upd);
        upd();
      });
    } else { batteryText.textContent = 'N/A'; }

    const title = document.getElementById("wave-title");
    const text = title.textContent;
    title.textContent = "";

    [...text].forEach((char, i) => {
      const span = document.createElement("span");
      span.textContent = char === " " ? "\u00A0" : char;
      span.style.animationDelay = `${i * 0.12}s`;
      title.appendChild(span);
    });

    title.classList.add("wave");
  </script>
</body>

</html>
