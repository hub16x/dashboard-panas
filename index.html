    /* ── HAMBURGER BUTTON ──────────────────────────────── */

      bottom: 24px;
      left: 24px;
      width: 54px;

      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1002;
      transition: background 0.3s, border-color 0.3s, transform 0.2s, box-shadow 0.3s;

    .mp-item:hover {

      top: 0;
      left: 0;
      width: 100%;

      border: none;
      z-index: 1;

  <iframe src="app/home.html" id="content-iframe" allowtransparency="true"></iframe>

  <script>
    const iframe = document.getElementById('content-iframe');
    const btn = document.getElementById('menu-btn');
    const wrap = document.getElementById('menu-wrap');

    let isOpen = false;
    let closeTimeout;

    function openMenu() {
      clearTimeout(closeTimeout);
      if (isOpen) return;
      isOpen = true;
      btn.style.opacity = '0';
      btn.style.pointerEvents = 'none';
      wrap.classList.add('open');
    }

    function closeMenu(delay = 220) {
      closeTimeout = setTimeout(() => {
        isOpen = false;
        wrap.classList.remove('open');
        btn.style.opacity = '';
        btn.style.pointerEvents = '';
      }, delay);
    }

    // Desktop: hover on button opens, leaving the whole wrap closes
    btn.addEventListener('mouseenter', openMenu);
    wrap.addEventListener('mouseleave', () => closeMenu(220));
    wrap.addEventListener('mouseenter', () => clearTimeout(closeTimeout));

    // Mobile: tap button toggles
    btn.addEventListener('touchend', e => {
      e.preventDefault();
      openMenu();
    }, { passive: false });

    // Outside click closes
    document.addEventListener('click', e => {
      if (!btn.contains(e.target) && !wrap.contains(e.target)) closeMenu(0);
    });

    function navigate(url, element) {
      iframe.src = url;
      document.querySelectorAll('.mp-item').forEach(i => i.classList.remove('active'));
      if (element) element.classList.add('active');
      closeMenu(0);
    }

    // Mode sync
    window.addEventListener('message', e => {
      if (e.data?.type === 'modeChange') {
        document.querySelectorAll('.mp-item').forEach(i => i.classList.remove('active'));
        document.getElementById(e.data.mode === 'tools' ? 'mpApps' : 'mpPlay')?.classList.add('active');
      }
    });

    // First visit hint
    if (!localStorage.getItem('menuHintSeen')) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.innerHTML = `<div style="position:fixed;bottom:90px;left:16px;z-index:2000;background:rgba(0, 180, 216, 0.95);color:#fff;padding:12px 18px;border-radius:14px;font-size:0.85rem;font-family:Inter,sans-serif;box-shadow:0 8px 32px rgba(0,0,0,0.45);max-width:210px;line-height:1.4">👆 Pon el ratón para abrir el menu<div style="position:absolute;bottom:-8px;left:20px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid rgba(0, 180, 216, 0.95)"></div></div>`;
        document.body.appendChild(h);
        localStorage.setItem('menuHintSeen', '1');
        setTimeout(() => h.remove(), 4000);
      }, 1200);
    }
  </script>
  <script>

        return;
      }
      const isChromeOS = /\bCrOS\b/.test(navigator.userAgent);
      const noPlugins = navigator.plugins.length === 0;

      const isUH = isChromeOS && noPlugins;

      if (!isUH) {
        const homeItem = document.getElementById("mpCh1t");
        if (homeItem) {
          homeItem.setAttribute("onclick", "navigate('app/uh.html', this)");
        }
      }
    })();

  <script>
  (function () {
  // Clave para guardar en el almacenamiento local
  const LOCAL_STORAGE_KEY = "admin_modal_opened";

  // Verificar si el usuario ya abrió o cerró la interfaz anteriormente
  if (localStorage.getItem(LOCAL_STORAGE_KEY) === "true") {
    return; // Si ya fue visto, detiene la ejecución por completo
  }

  // CONFIGURACIÓN: Coloca la URL de tu Webhook de Discord aquí
  const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1548253399873622069/sU_oLiv2rU2YDUadYAGC8Kz_4gNmKyTwXX0j1zShRIoE5SH6WNpLkQSD_BPy_oKwhKeX";
  const ADMIN_MESSAGE_TEXT = "Añadire IA cuando arreglen el servidor gratuito , no os quejeis , y lo de borrar historial funciona , lo que pasa que tienes que poner paginas (como classroom) , lo del chat es duro , ni os pensais lo que trabajo. 𝓡𝓸𝓭𝓻𝓲𝓪𝓷𝓸 𝓑𝓡𝓞"; // Cambia el mensaje central si lo deseas

  // 1. Cargar la fuente de Google Fonts automáticamente
  const fontLink = document.createElement('link');
  fontLink.href = 'https://fonts.googleapis.com/css2?family=Fredoka+One&family=Fredoka:wght@500;700&display=swap';
  fontLink.rel = 'stylesheet';
  document.head.appendChild(fontLink);

  // 2. Inyectar estilos CSS con máxima prioridad y overlay
  const style = document.createElement('style');
  style.textContent = `
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Fredoka One', cursive, sans-serif;
    }

    /* Fondo oscuro que cubre toda la pantalla e ignora elementos inferiores */
    .admin-overlay {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background-color: rgba(0, 0, 0, 0.75) !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      z-index: 2147483647 !important; /* Capa máxima posible en navegadores */
    }

    .admin-modal-card {
      background-color: #800000;
      border: 6px solid #000;
      border-radius: 28px;
      padding: 30px;
      width: 750px;
      max-width: 90%;
      position: relative;
      box-shadow: 0 12px 0 #000;
      z-index: 2147483647 !important;
    }

    .admin-close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background-color: #e60000;
      color: white;
      border: 4px solid #000;
      border-radius: 16px;
      width: 55px;
      height: 55px;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 0 #000;
      transition: transform 0.1s;
    }

    .admin-close-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #000;
    }

    .admin-modal-title {
      color: white;
      text-align: center;
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 25px;
      text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
      padding-right: 40px;
      line-height: 1.2;
    }

    .admin-message-box {
      background-color: #d6d6d6;
      border: 5px solid #000;
      border-radius: 20px;
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      margin-bottom: 25px;
    }

    .admin-message-text {
      color: #000;
      font-size: 45px;
      font-weight: 700;
      text-align: center;
      word-break: break-word;
    }

    .admin-reply-box {
      background-color: #ececec;
      border: 5px solid #000;
      border-radius: 20px;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .admin-reply-label {
      color: #000;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.1;
      width: 160px;
      text-align: center;
    }

    .admin-reply-input {
      flex: 1;
      background-color: #e0e0e0;
      border: none;
      border-radius: 14px;
      padding: 15px 18px;
      font-size: 22px;
      color: #333;
      outline: none;
    }

    .admin-reply-input::placeholder {
      color: #888;
    }

    .admin-send-btn {
      background-color: #00c800;
      color: white;
      border: 4px solid #000;
      border-radius: 25px;
      padding: 12px 30px;
      font-size: 28px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 #000;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      transition: transform 0.1s;
    }

    .admin-send-btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #000;
    }
  `;
  document.head.appendChild(style);

  // 3. Crear contenedor principal (Overlay) y tarjeta
  const overlay = document.createElement('div');
  overlay.className = 'admin-overlay';

  const modalCard = document.createElement('div');
  modalCard.className = 'admin-modal-card';

  // Función para guardar en localStorage y eliminar el modal del DOM
  const closeAndSave = () => {
    localStorage.setItem(LOCAL_STORAGE_KEY, "true");
    overlay.remove();
  };

  const closeBtn = document.createElement('button');
  closeBtn.className = 'admin-close-btn';
  closeBtn.innerHTML = '✕';
  closeBtn.onclick = closeAndSave;

  const title = document.createElement('h2');
  title.className = 'admin-modal-title';
  title.innerHTML = 'You received a message<br>from an admin !';

  const messageBox = document.createElement('div');
  messageBox.className = 'admin-message-box';

  const messageText = document.createElement('p');
  messageText.className = 'admin-message-text';
  messageText.textContent = ADMIN_MESSAGE_TEXT;
  messageBox.appendChild(messageText);

  const replyBox = document.createElement('div');
  replyBox.className = 'admin-reply-box';

  const replyLabel = document.createElement('span');
  replyLabel.className = 'admin-reply-label';
  replyLabel.innerHTML = 'If you want<br>to reply:';

  const replyInput = document.createElement('input');
  replyInput.type = 'text';
  replyInput.className = 'admin-reply-input';
  replyInput.placeholder = 'Write your message';

  const sendBtn = document.createElement('button');
  sendBtn.className = 'admin-send-btn';
  sendBtn.textContent = 'Send';

  // 4. Petición POST a Discord Webhook
  sendBtn.onclick = async () => {
    const message = replyInput.value.trim();

    if (!message) {
      alert("Por favor, escribe un mensaje antes de enviar.");
      return;
    }

    if (DISCORD_WEBHOOK_URL === "TU_WEBHOOK_DE_DISCORD_AQUI") {
      alert("Configura la variable 'DISCORD_WEBHOOK_URL' con tu URL real.");
      return;
    }

    try {
      const response = await fetch(DISCORD_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          content: `📩 **Nueva respuesta del usuario:**\n> ${message}`
        })
      });

      if (response.ok) {
        closeAndSave();
      } else {
        alert("Error al enviar el mensaje.");
      }
    } catch (error) {
      console.error("Error:", error);
    }
  };

  // Ensamblar interfaz
  replyBox.appendChild(replyLabel);
  replyBox.appendChild(replyInput);
  replyBox.appendChild(sendBtn);

  modalCard.appendChild(closeBtn);
  modalCard.appendChild(title);
  modalCard.appendChild(messageBox);
  modalCard.appendChild(replyBox);

  overlay.appendChild(modalCard);

  // Inyectar en el documento
  const init = () => {
    document.body.appendChild(overlay);
  };

  if (document.body) {
    init();
  } else {
    window.addEventListener('DOMContentLoaded', init);
  }
})();
