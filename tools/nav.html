<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Navegador Glass Fullscreen</title>
    <!-- Fuente Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #0b0f19, #1e1b4b, #2a0845);
            color: #fff;
        }

        .browser-container {
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
        }

        .navbar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot.close { background: #ff5f56; }
        .dot.minimize { background: #ffbd2e; }
        .dot.maximize { background: #27c93f; }

        .url-form {
            flex-grow: 1;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 6px 18px;
            transition: all 0.3s ease;
        }

        .url-form:focus-within {
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.5);
        }

        .url-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 14px;
            font-weight: 400;
        }

        .btn-go {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-go:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .viewport {
            flex-grow: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        .error-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 99;
        }

        .error-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .error-icon {
            font-size: 56px;
            margin-bottom: 20px;
        }

        .error-card h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #f87171;
        }

        .error-card p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn-retry {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-retry:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

    <div class="browser-container">
        <div class="navbar">
            <div class="window-controls">
                <div class="dot close"></div>
                <div class="dot minimize"></div>
                <div class="dot maximize"></div>
            </div>

            <form class="url-form" id="browser-form">
                <input type="text" id="url-input" class="url-input" placeholder="Escribe una URL (ej. wikipedia.org)..." autocomplete="off">
                <button type="submit" class="btn-go">Navegar</button>
            </form>
        </div>

        <div class="viewport">
            <iframe id="web-frame" src="about:blank"></iframe>

            <div class="error-screen" id="error-screen">
                <div class="error-card">
                    <div class="error-icon">⚠️</div>
                    <h2>Acceso denegado o no disponible</h2>
                    <p id="error-message">La dirección indicada intenta acceder a un protocolo interno restringido (chrome-error://) o la web no permite cargarse en marcos.</p>
                    <button class="btn-retry" onclick="resetBrowser()">Cargar otra URL</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('browser-form');
        const urlInput = document.getElementById('url-input');
        const iframe = document.getElementById('web-frame');
        const errorScreen = document.getElementById('error-screen');
        const errorMessage = document.getElementById('error-message');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            let url = urlInput.value.trim();

            if (!url) return;

            // 1. Bloqueo si la entrada empieza explícitamente por rutas internas restringidas
            const urlLower = url.toLowerCase();
            if (urlLower.startsWith('chrome-error://') || urlLower.startsWith('chrome://')) {
                showError('No es posible acceder a páginas del sistema ni a direcciones chrome-error://.');
                return;
            }

            // Normalización del protocolo HTTPS
            if (!url.startsWith('http://') && !url.startsWith('https://') && url !== 'about:blank') {
                url = 'https://' + url;
                urlInput.value = url;
            }

            // Ocultar error previo y cargar iframe
            errorScreen.style.display = 'none';
            iframe.src = url;
        });

        // 2. Comprobación post-carga
        iframe.addEventListener('load', () => {
            if (iframe.src === 'about:blank') return;

            try {
                // Si la página es del mismo origen o accesible localmente, verificamos su URL interna
                const currentUrl = iframe.contentWindow.location.href;
                if (currentUrl.startsWith('chrome-error://') || currentUrl.startsWith('chrome://')) {
                    showError('La página fue redirigida a una ventana de error interna (chrome-error://).');
                }
            } catch (e) {
                // Al cargar un sitio externo exitosamente (ej. wikipedia.org), JavaScript lanza este error de CORS/Security.
                // Es el comportamiento correcto de los navegadores para páginas externas válidas.
            }
        });

        // 3. Captura si el elemento iframe lanza un evento directo de falla
        iframe.addEventListener('error', () => {
            showError('Falló la conexión con el servidor.');
        });

        function showError(msg) {
            errorMessage.textContent = msg;
            errorScreen.style.display = 'flex';
            iframe.src = 'about:blank';
        }

        function resetBrowser() {
            errorScreen.style.display = 'none';
            urlInput.value = '';
            urlInput.focus();
        }
    </script>
</body>
</html>
