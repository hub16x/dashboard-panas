<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utility Studio Multi-Alarm Pro</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        /* Reseteo y Transparencia Estricta */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            background: transparent !important;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        /* Contenedor Cristalizado */
        .utility-container {
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            max-height: 95vh;
            display: flex;
            flex-direction: column;
        }

        /* Menú de Pestañas (Tabs) */
        .tabs {
            display: flex;
            gap: 5px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 5px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 7px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.08);
            color: #00ffcc;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        /* Contenido de Paneles */
        .panel {
            display: none;
            animation: fadeIn 0.3s ease;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 2px;
        }

        /* Scrollbar estilizada y discreta para la lista de alarmas */
        .panel::-webkit-scrollbar {
            width: 4px;
        }
        .panel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .panel.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #00ffcc;
        }

        .flex-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .input-wrap {
            flex: 1;
        }

        /* Reloj Digital */
        .live-clock {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.3rem;
            text-align: center;
            color: #00ffcc;
            margin-bottom: 15px;
            text-shadow: 0 0 12px rgba(0, 255, 204, 0.2);
            flex-shrink: 0;
        }

        /* Botones */
        button.action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #00ffcc, #00aaff);
            color: #05101a;
            transition: transform 0.1s ease, box-shadow 0.3s ease;
        }

        button.action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 255, 204, 0.3);
        }

        .setup-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .audio-upload-wrapper {
            flex: 1.3;
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .audio-upload-wrapper span {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .audio-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }

        /* Lista de Alarmas Creadas */
        .alarms-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .alarm-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 15px;
            border-radius: 12px;
            animation: fadeIn 0.2s ease;
        }

        .alarm-info h3 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            color: #fff;
            font-weight: 500;
        }

        .alarm-control-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Botón Eliminar Alarma */
        .btn-delete-alarm {
            background: transparent;
            border: none;
            color: rgba(255, 59, 48, 0.6);
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.2s;
            padding: 4px;
        }
        .btn-delete-alarm:hover {
            color: rgba(255, 59, 48, 1);
        }

        /* Interruptor Switch CSS */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.15);
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 50%;
        }
        input:checked + .slider { background-color: #00ffcc; }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Estilos Cronómetro */
        .timer-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.2rem;
            text-align: center;
            margin: 15px 0;
            color: #00ffcc;
        }

        /* Estilos Aleatorio */
        .random-result {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3rem;
            text-align: center;
            margin: 15px 0;
            color: #00aaff;
            font-weight: 600;
        }

        /* Estilos Analizador */
        .counter-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.15);
            padding: 10px;
            border-radius: 8px;
        }
        .stat-val { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: #00ffcc; font-weight: 600; }
        .stat-lbl { font-size: 0.7rem; color: rgba(255, 255, 255, 0.4); text-transform: uppercase; text-align: center; }

        /* Pantalla de Alarma Sonando */
        .ringing-alert {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
        }
        .ringing-alert h2 { font-size: 1.8rem; color: #ff3b30; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255,59,48,0.3); }
        .btn-stop { padding: 12px 30px; background: #ff3b30; color: white; border: none; border-radius: 25px; font-weight: 600; cursor: pointer; box-shadow: 0 0 15px rgba(255, 59, 48, 0.4); }
    </style>
</head>
<body>

    <div class="utility-container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('alarm-panel', this)">⏰ Alarmas</button>
            <button class="tab-btn" onclick="switchTab('timer-panel', this)">⏳ Cuenta Atrás</button>
            <button class="tab-btn" onclick="switchTab('random-panel', this)">🎲 Aleatorio</button>
            <button class="tab-btn" onclick="switchTab('text-panel', this)">📝 Analizador</button>
        </div>

        <div id="alarm-panel" class="panel active">
            <div class="live-clock" id="master-clock">00:00:00</div>
            
            <div class="setup-box">
                <div class="flex-group" style="margin-bottom: 10px;">
                    <div class="input-wrap">
                        <input type="time" id="new-alarm-time" value="07:00" style="height: 44px; font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; text-align: center;">
                    </div>
                    <div class="audio-upload-wrapper">
                        <span id="audio-label">🎵 Cambiar Tono Local</span>
                        <input type="file" id="audio-file" accept="audio/*,video/mp4" onchange="loadAudio(this)">
                    </div>
                </div>
                <button class="action-btn" onclick="addAlarm()">Añadir Alarma +</button>
            </div>

            <div class="alarms-container" id="alarms-list"></div>
        </div>

        <div id="timer-panel" class="panel">
            <div class="flex-group">
                <div class="input-wrap">
                    <label>Minutos</label>
                    <input type="number" id="timer-min" min="0" value="0">
                </div>
                <div class="input-wrap">
                    <label>Segundos</label>
                    <input type="number" id="timer-sec" min="0" max="59" value="10">
                </div>
            </div>
            <div class="timer-display" id="timer-text">00:10</div>
            <div class="flex-group">
                <button class="action-btn" id="btn-countdown" onclick="toggleCountdown()">Iniciar ⏳</button>
                <button class="action-btn" style="background: rgba(255,255,255,0.05); color:#fff; border:1px solid rgba(255,255,255,0.1); width: auto;" onclick="resetCountdown()">Reset</button>
            </div>
        </div>

        <div id="random-panel" class="panel">
            <div class="flex-group">
                <div class="input-wrap">
                    <label>Mínimo</label>
                    <input type="number" id="rand-min" value="1">
                </div>
                <div class="input-wrap">
                    <label>Máximo</label>
                    <input type="number" id="rand-max" value="100">
                </div>
            </div>
            <div class="random-result" id="random-text">--</div>
            <button class="action-btn" onclick="generateRandom()">Generar Número 🎲</button>
        </div>

        <div id="text-panel" class="panel">
            <label>Analizar Texto</label>
            <textarea id="text-analyzer" style="height: 110px;" placeholder="Pega tu texto aquí..." oninput="analyzeText()"></textarea>
            <div class="counter-stats">
                <div class="stat-item">
                    <div class="stat-val" id="stat-chars">0</div>
                    <div class="stat-lbl">Caracteres</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val" id="stat-words">0</div>
                    <div class="stat-lbl">Palabras</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val" id="stat-lines">0</div>
                    <div class="stat-lbl">Líneas</div>
                </div>
            </div>
        </div>
    </div>

    <div class="ringing-alert" id="popup-screen">
        <h2>⏰ ALARMA SONANDO</h2>
        <button class="btn-stop" onclick="stopAlarm()">APAGAR</button>
    </div>

    <audio id="global-player" loop></audio>

    <script>
        // --- NAVEGACIÓN ---
        function switchTab(panelId, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
            btn.classList.add('active');
        }

        // --- SISTEMA DE ALARMAS MÚLTIPLES ---
        let alarmsArray = [
            { id: 1, time: "07:00", active: false },
            { id: 2, time: "08:30", active: false }
        ];
        let isCustomAudio = false;
        let activeRingingAlarmId = null;
        const audioPlayer = document.getElementById('global-player');

        // Renderizar la lista completa de alarmas
        function renderAlarms() {
            const listContainer = document.getElementById('alarms-list');
            listContainer.innerHTML = '';

            // Ordenar las alarmas por hora cronológica para mejor visualización
            alarmsArray.sort((a, b) => a.time.localeCompare(b.time));

            alarmsArray.forEach(alarm => {
                const alarmItem = document.createElement('div');
                alarmItem.className = 'alarm-item';
                alarmItem.innerHTML = `
                    <div class="alarm-info">
                        <h3>${alarm.time}</h3>
                    </div>
                    <div class="alarm-control-right">
                        <label class="switch">
                            <input type="checkbox" ${alarm.active ? 'checked' : ''} onchange="toggleAlarm(${alarm.id}, this.checked)">
                            <span class="slider"></span>
                        </label>
                        <button class="btn-delete-alarm" onclick="deleteAlarm(${alarm.id})" title="Eliminar Alarma">✕</button>
                    </div>
                `;
                listContainer.appendChild(alarmItem);
            });
        }

        function addAlarm() {
            const timeInput = document.getElementById('new-alarm-time').value;
            if (!timeInput) return;

            // Evitar duplicados exactos si se desea
            if (alarmsArray.some(a => a.time === timeInput)) {
                alert("Ya existe una alarma configurada para esa hora.");
                return;
            }

            const newAlarm = {
                id: Date.now(),
                time: timeInput,
                active: true
            };

            alarmsArray.push(newAlarm);
            renderAlarms();
        }

        function toggleAlarm(id, isChecked) {
            const alarm = alarmsArray.find(a => a.id === id);
            if (alarm) alarm.active = isChecked;
        }

        function deleteAlarm(id) {
            alarmsArray = alarmsArray.filter(a => a.id !== id);
            renderAlarms();
        }

        // Reloj Maestro + Verificador en bucle de tiempos
        setInterval(() => {
            const now = new Date();
            const h = now.getHours().toString().padStart(2, '0');
            const m = now.getMinutes().toString().padStart(2, '0');
            const s = now.getSeconds().toString().padStart(2, '0');
            
            document.getElementById('master-clock').innerText = `${h}:${m}:${s}`;

            // Solo comprueba al inicio del segundo 00
            if (s === "00") {
                const triggerTime = `${h}:${m}`;
                alarmsArray.forEach(alarm => {
                    if (alarm.active && alarm.time === triggerTime) {
                        triggerAlarm(alarm.id);
                    }
                });
            }
        }, 1000);

        // Lector de audio local
        function loadAudio(input) {
            const file = input.files[0];
            if (!file) return;
            audioPlayer.src = URL.createObjectURL(file);
            isCustomAudio = true;
            document.getElementById('audio-label').innerText = "🎵 Audio Listo";
        }

        function triggerAlarm(alarmId) {
            activeRingingAlarmId = alarmId;
            if (!isCustomAudio) {
                audioPlayer.src = "/media/alarm.mp3";
            }
            audioPlayer.play().catch(e => console.log(e));
            document.getElementById('popup-screen').style.display = 'flex';
        }

        function stopAlarm() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            document.getElementById('popup-screen').style.display = 'none';
            
            // Si la alarma que sonaba venía del panel de alarmas horarias, la desactivamos tras sonar
            if (activeRingingAlarmId) {
                toggleAlarm(activeRingingAlarmId, false);
                activeRingingAlarmId = null;
                renderAlarms();
            }
        }

        // --- LÓGICA CUENTA ATRÁS ---
        let countdownInterval = null;
        let countdownSeconds = 0;
        let isCountdownRunning = false;

        function updateCountdownDisplay(totalSecs) {
            const mins = Math.floor(totalSecs / 60).toString().padStart(2, '0');
            const secs = (totalSecs % 60).toString().padStart(2, '0');
            document.getElementById('timer-text').innerText = `${mins}:${secs}`;
        }

        function toggleCountdown() {
            const btn = document.getElementById('btn-countdown');
            if (isCountdownRunning) {
                clearInterval(countdownInterval);
                isCountdownRunning = false;
                btn.innerText = "Reanudar ⏳";
                return;
            }
            if (countdownSeconds === 0) {
                const m = parseInt(document.getElementById('timer-min').value) || 0;
                const s = parseInt(document.getElementById('timer-sec').value) || 0;
                countdownSeconds = (m * 60) + s;
            }
            if (countdownSeconds <= 0) return;

            isCountdownRunning = true;
            btn.innerText = "Pausar ⏸";

            countdownInterval = setInterval(() => {
                countdownSeconds--;
                updateCountdownDisplay(countdownSeconds);
                if (countdownSeconds <= 0) {
                    clearInterval(countdownInterval);
                    isCountdownRunning = false;
                    btn.innerText = "Iniciar ⏳";
                    triggerAlarm(null); // Lanzar alarma genérica de temporizador
                }
            }, 1000);
        }

        function resetCountdown() {
            clearInterval(countdownInterval);
            isCountdownRunning = false;
            countdownSeconds = 0;
            document.getElementById('btn-countdown').innerText = "Iniciar ⏳";
            const m = parseInt(document.getElementById('timer-min').value) || 0;
            const s = parseInt(document.getElementById('timer-sec').value) || 0;
            updateCountdownDisplay((m * 60) + s);
        }

        // --- LÓGICA ALEATORIO ---
        function generateRandom() {
            const min = parseInt(document.getElementById('rand-min').value);
            const max = parseInt(document.getElementById('rand-max').value);
            if (isNaN(min) || isNaN(max) || min > max) return;

            let ticks = 0;
            const interval = setInterval(() => {
                document.getElementById('random-text').innerText = Math.floor(Math.random() * (max - min + 1)) + min;
                if (++ticks > 6) {
                    clearInterval(interval);
                    document.getElementById('random-text').innerText = Math.floor(Math.random() * (max - min + 1)) + min;
                }
            }, 40);
        }

        // --- LÓGICA ANALIZADOR DE TEXTO ---
        function analyzeText() {
            const text = document.getElementById('text-analyzer').value;
            document.getElementById('stat-chars').innerText = text.length;
            document.getElementById('stat-words').innerText = text.trim() === "" ? 0 : text.trim().split(/\s+/).length;
            document.getElementById('stat-lines').innerText = text === "" ? 0 : text.split('\n').length;
        }

        // Inicializar la app mostrando las alarmas iniciales de muestra
        renderAlarms();
    </script>
</body>
</html>
