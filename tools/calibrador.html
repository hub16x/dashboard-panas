<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Batería Caja Negra Real</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            --text-color: #ffffff;
            --accent-neon: #00ffcc;
            --sub-accent: #3399ff;
            --warning-color: #ff4a5a;
            --charging-color: #ffcc00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background-color: #090d12; color: var(--text-color); min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
            overflow-x: hidden; position: relative;
        }

        body::before {
            content: ''; position: absolute; width: 160%; height: 160%;
            background: radial-gradient(circle at 15% 20%, rgba(0, 255, 204, 0.2) 0%, transparent 45%),
                        radial-gradient(circle at 85% 75%, rgba(255, 74, 90, 0.15) 0%, transparent 45%),
                        radial-gradient(circle at 50% 50%, rgba(51, 153, 255, 0.15) 0%, transparent 50%);
            animation: moveBg 18s linear infinite alternate; z-index: -1; filter: blur(70px);
        }

        @keyframes moveBg {
            0% { transform: translate(-5%, -5%) rotate(0deg); }
            100% { transform: translate(5%, 5%) rotate(8deg); }
        }

        .glass-container {
            background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border); border-radius: 32px; box-shadow: var(--glass-shadow);
            width: 100%; max-width: 680px; padding: 35px; text-align: center;
        }

        h1 { font-weight: 300; font-size: 1.8rem; margin-bottom: 25px; letter-spacing: -0.5px; }
        h1 span { color: var(--accent-neon); font-weight: 800; }

        .view-selector {
            display: flex; background: rgba(0, 0, 0, 0.4); border-radius: 12px; padding: 5px; margin-bottom: 25px;
        }

        .view-btn {
            flex: 1; background: transparent; color: rgba(255, 255, 255, 0.6); border: none;
            padding: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border-radius: 8px;
            text-transform: uppercase; transition: all 0.2s ease;
        }

        .view-btn.active { background: rgba(255, 255, 255, 0.1); color: var(--accent-neon); }

        .display-box {
            background: rgba(0, 0, 0, 0.35); border-radius: 24px; padding: 45px 20px; margin-bottom: 25px;
            box-shadow: inset 0 4px 30px rgba(0,0,0,0.4);
        }

        .huge-value {
            font-size: 6rem; font-weight: 800; line-height: 1; color: var(--accent-neon);
            text-shadow: 0 0 40px rgba(0, 255, 204, 0.5);
        }

        .display-box.charging-mode .huge-value { color: var(--charging-color); text-shadow: 0 0 40px rgba(255, 204, 0, 0.5); }

        .huge-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.5; margin-top: 15px; margin-bottom: 25px; }
        .secondary-value-box { border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 20px; font-size: 1.6rem; font-weight: 600; color: var(--sub-accent); }
        .secondary-label { font-size: 0.75rem; opacity: 0.5; text-transform: uppercase; margin-top: 4px; }

        .status-panel { background: rgba(0, 0, 0, 0.25); border-radius: 20px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.05); text-align: left; font-size: 0.9rem; }
        .status-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 8px; }
        .status-title { font-weight: 600; color: var(--accent-neon); text-transform: uppercase; font-size: 0.8rem; }
        .info-text { line-height: 1.5; opacity: 0.85; }
        .info-text strong { color: var(--accent-neon); }

        .reset-storage-btn {
            background: rgba(255, 74, 90, 0.15); color: #ff8888; border: 1px solid var(--warning-color);
            border-radius: 8px; padding: 8px 12px; font-size: 0.75rem; cursor: pointer; font-weight: 600; margin-top: 12px;
        }

        @media (max-width: 550px) { .huge-value { font-size: 4rem; } }
    </style>
</head>
<body>

    <div class="glass-container">
        <svg id="batteryIcon" style="width:45px; height:45px; fill:var(--accent-neon); margin-bottom:10px;" viewBox="0 0 24 24">
            <path d="M7 2v11h3v9l7-12h-4l4-8H7z"/>
        </svg>

        <h1>Batería <span>REAL</span> Inteligente</h1>

        <div class="view-selector">
            <button class="view-btn" id="modePercentBtn" onclick="setViewMode('percent')">Ver % en Grande</button>
            <button class="view-btn active" id="modeTimeBtn" onclick="setViewMode('time')">Ver Tiempo en Grande</button>
        </div>

        <div class="display-box" id="displayBox">
            <div class="huge-value" id="mainDisplay">--h --m</div>
            <div class="huge-label" id="mainLabel">Duración Restante Real</div>
            
            <div class="secondary-value-box" id="secondaryDisplay">--%</div>
            <div class="secondary-label" id="secondaryLabel">Porcentaje Útil Real</div>
        </div>

        <div class="status-panel">
            <div class="status-header">
                <span class="status-title">Sistema de Caja Negra Activo</span>
                <span id="calibrationStatusBadge" style="font-size:0.75rem; background:rgba(0,255,204,0.15); color:var(--accent-neon); padding:2px 8px; border-radius:12px; font-weight:600;">Protegido</span>
            </div>
            <p class="info-text" id="statusDescription">Detectando constantes vitales del sistema...</p>
            <button class="reset-storage-btn" onclick="clearLocalStorageData()">Reiniciar Memoria</button>
        </div>
    </div>

    <script>
        let currentMode = 'time'; 
        let systemBattery = null;
        let totalUsableMinutes = 120; 
        let globalInterval = null;

        if (localStorage.getItem('usableMinutesUntilPanic')) {
            totalUsableMinutes = parseFloat(localStorage.getItem('usableMinutesUntilPanic'));
        }

        function setViewMode(mode) {
            currentMode = mode;
            document.getElementById('modePercentBtn').classList.toggle('active', mode === 'percent');
            document.getElementById('modeTimeBtn').classList.toggle('active', mode === 'time');
            updateUI();
        }

        if ('getBattery' in navigator) {
            navigator.getBattery().then(battery => {
                systemBattery = battery;
                
                // PROCESAR CAJA NEGRA POST-MORTEM AL ABRIR LA PÁGINA
                analizarCajaNegra(battery);

                battery.addEventListener('levelchange', () => sincronizarCiclos(battery));
                battery.addEventListener('chargingchange', () => sincronizarCiclos(battery));
                
                if (globalInterval) clearInterval(globalInterval);
                globalInterval = setInterval(() => {
                    sincronizarCiclos(battery);
                    updateUI();
                }, 10000); // Latido y refresco cada 10 segundos para no saturar
                
                updateUI();
            });
        }

        function analizarCajaNegra(battery) {
            const isCharging = battery.charging;
            const startTime = localStorage.getItem('chromeosCycleStart');
            const lastHeartbeat = localStorage.getItem('blackbox_heartbeat');

            // Si abrimos la página, está CARGANDO, y se quedó un ciclo abierto en el fondo sin cerrar... ¡FUE UN APAGADO!
            if (isCharging && startTime && lastHeartbeat) {
                const totalDurationMs = parseFloat(lastHeartbeat) - parseFloat(startTime);
                const elapsedMinutes = totalDurationMs / (1000 * 60);

                if (elapsedMinutes > 5) { // Evitar errores si se enchufa al instante
                    const historicalData = localStorage.getItem('usableMinutesUntilPanic');
                    let finalMinutes = elapsedMinutes;

                    if (historicalData) {
                        const oldMinutes = parseFloat(historicalData);
                        finalMinutes = (oldMinutes * 0.7) + (elapsedMinutes * 0.3); // Promedio Inteligente
                    }

                    localStorage.setItem('usableMinutesUntilPanic', finalMinutes.toFixed(2));
                    totalUsableMinutes = finalMinutes;
                }
                // Limpiar la caja negra para el próximo ciclo limpio
                localStorage.removeItem('chromeosCycleStart');
                localStorage.removeItem('blackbox_heartbeat');
            }
        }

        function sincronizarCiclos(battery) {
            const osPercent = Math.floor(battery.level * 100);
            const isCharging = battery.charging;

            if (!isCharging) {
                // Si no hay ciclo activo iniciado, lo creamos (al estar en la parte alta)
                if (!localStorage.getItem('chromeosCycleStart') && osPercent >= 95) {
                    localStorage.setItem('chromeosCycleStart', Date.now());
                }
                // GUARDAR EL LATIDO CONSTANTE DE LA CAJA NEGRA
                if (localStorage.getItem('chromeosCycleStart')) {
                    localStorage.setItem('blackbox_heartbeat', Date.now());
                }
            } else {
                // Si se pone a cargar de forma voluntaria, limpiamos los rastreadores activos para no falsear datos
                localStorage.removeItem('chromeosCycleStart');
                localStorage.removeItem('blackbox_heartbeat');
            }
            updateStatusText(isCharging);
        }

        function updateStatusText(isCharging) {
            const desc = document.getElementById('statusDescription');
            const badge = document.getElementById('calibrationStatusBadge');
            const icon = document.getElementById('batteryIcon');
            const displayBox = document.getElementById('displayBox');
            const cycleActive = localStorage.getItem('chromeosCycleStart') !== null;
            
            let baseText = `Promedio calibrado: <strong>${Math.floor(totalUsableMinutes / 60)}h ${Math.floor(totalUsableMinutes % 60)}m</strong>.<br>`;

            if (isCharging) {
                badge.innerText = "Cargando ⚡";
                badge.style.background = "rgba(255,204,0,0.15)"; badge.style.color = "var(--charging-color)";
                icon.style.fill = "var(--charging-color)";
                displayBox.classList.add('charging-mode');
                desc.innerHTML = baseText + "Caja negra en espera. El script analizará los datos de la última descarga de forma retrospectiva.";
            } else {
                badge.innerText = "Caja Negra Activa 💾";
                badge.style.background = "rgba(0,255,204,0.15)"; badge.style.color = "var(--accent-neon)";
                icon.style.fill = "var(--accent-neon)";
                displayBox.classList.remove('charging-mode');
                
                if (cycleActive) {
                    desc.innerHTML = baseText + `Escribiendo telemetría en disco cada 10s. Puedes dejar la pestaña en segundo plano tranquilamente.`;
                } else {
                    desc.innerHTML = baseText + "Para calibrar un nuevo ciclo, recuerda empezar a usarla desde el 100%.";
                }
            }
        }

        function updateUI() {
            if (!systemBattery) return;

            const osPercent = Math.floor(systemBattery.level * 100);
            const isCharging = systemBattery.charging;
            const startTimeSaved = localStorage.getItem('chromeosCycleStart');

            let timeString = "";
            let displayPercent = osPercent;

            const mainDisplay = document.getElementById('mainDisplay');
            const mainLabel = document.getElementById('mainLabel');
            const secondaryDisplay = document.getElementById('secondaryDisplay');
            const secondaryLabel = document.getElementById('secondaryLabel');

            if (isCharging) {
                let chargeTimeMins = 0;
                if (systemBattery.chargingTime && isFinite(systemBattery.chargingTime) && systemBattery.chargingTime > 0) {
                    chargeTimeMins = systemBattery.chargingTime / 60;
                } else {
                    chargeTimeMins = (100 - osPercent) * 1.3;
                }

                let cHours = Math.floor(chargeTimeMins / 60);
                let cMins = Math.floor(chargeTimeMins % 60);
                timeString = `${cHours}h ${cMins}m`;

                if (currentMode === 'time') {
                    mainDisplay.innerText = timeString; mainLabel.innerText = "Tiempo para Carga Completa";
                    secondaryDisplay.innerText = `${displayPercent}%`; secondaryLabel.innerText = "Porcentaje Cargado";
                } else {
                    mainDisplay.innerText = `${displayPercent}%`; mainLabel.innerText = "Porcentaje Cargado";
                    secondaryDisplay.innerText = timeString; secondaryLabel.innerText = "Tiempo para Carga Completa";
                }

            } else {
                let currentMinutesLeft = totalUsableMinutes * (osPercent / 100);

                if (startTimeSaved) {
                    const elapsedMinutes = (Date.now() - parseFloat(startTimeSaved)) / (1000 * 60);
                    currentMinutesLeft = totalUsableMinutes - elapsedMinutes;
                    if (currentMinutesLeft < 0) currentMinutesLeft = 0;
                    displayPercent = Math.ceil((currentMinutesLeft / totalUsableMinutes) * 100);
                    if (displayPercent < 0) displayPercent = 0;
                }

                let rHours = Math.floor(currentMinutesLeft / 60);
                let rMins = Math.floor(currentMinutesLeft % 60);
                timeString = `${rHours}h ${rMins}m`;

                if (currentMode === 'time') {
                    mainDisplay.innerText = timeString; mainLabel.innerText = "Duración Restante Real";
                    secondaryDisplay.innerText = `${displayPercent}%`; secondaryLabel.innerText = "Porcentaje Útil Real";
                } else {
                    mainDisplay.innerText = `${displayPercent}%`; mainLabel.innerText = "Porcentaje Útil Real";
                    secondaryDisplay.innerText = timeString; secondaryLabel.innerText = "Duración Restante Real";
                }
            }
        }

        function clearLocalStorageData() {
            localStorage.clear();
            totalUsableMinutes = 120;
            if (systemBattery) sincronizarCiclos(systemBattery);
            updateUI();
            alert("Memoria y Caja Negra formateadas.");
        }
    </script>
</body>
</html>
