<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    html, body {
      background: transparent;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #ffffff;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.9);
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    input[type="text"]:focus {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .submit-btn {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      background: rgba(255, 255, 255, 0.35);
      border-color: rgba(255, 255, 255, 0.6);
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <h1 class="title">Bloqueador Fake Páginas</h1>

    <div class="form-group">
      <label for="inputUrl">URL de la página falsa</label>
      <input type="text" id="inputUrl" placeholder="Escribe la URL...">
    </div>

    <div class="form-group">
      <label for="inputReason">Motivo porque esta bloqueada</label>
      <input type="text" id="inputReason" placeholder="Escribe el motivo...">
    </div>

    <button class="submit-btn" onclick="executeRedirect()">Abrir</button>
  </div>

  <script>
    function executeRedirect() {
      const baseUrl = '/tools/imtfakepagUI.html';
      const urlValue = document.getElementById('inputUrl').value.trim();
      const reasonValue = document.getElementById('inputReason').value.trim();

      const params = new URLSearchParams();

      if (urlValue) {
        params.append('url', urlValue);
      }

      if (reasonValue) {
        params.append('reason', reasonValue);
      }

      const queryString = params.toString();

      if (queryString) {
        window.open(`${baseUrl}?${queryString}`, '_blank');
      }
    }
  </script>

</body>
</html>
