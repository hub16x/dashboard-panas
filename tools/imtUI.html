<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación requerida</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-disabled: #334155;
            --text-disabled: #64748b;
            --primary-hover: #0284c7;
            --glow-color: rgba(56, 189, 248, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
        }

        .window-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 480px;
            width: 90%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            line-height: 1.3;
            letter-spacing: -0.02em;
        }

        .shortcut {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-family: monospace;
            font-size: 0.9em;
        }

        .countdown {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-variant-numeric: tabular-nums;
        }

        .btn-confirm {
            background-color: var(--primary-disabled);
            color: var(--text-disabled);
            border: 1px solid transparent;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: not-allowed;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
        }

        .btn-confirm.active {
            background-color: var(--primary);
            color: #0f172a;
            cursor: pointer;
            box-shadow: 0 0 20px var(--glow-color);
        }

        .btn-confirm.active:hover {
            background-color: var(--primary-hover);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 0 30px var(--glow-color);
        }

        .btn-confirm.active:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="window-card">
        <h1>Presiona <span class="shortcut">Alt + Z</span> para cerrar</h1>
        <div class="countdown" id="countdown-text">Espera 5.0s para confirmar</div>
        <button id="confirm-btn" class="btn-confirm" disabled>Confirmar</button>
    </div>

    <script>
        const TARGET_URL = '/tools/imt.html';
        let timeLeft = 5.0;
        const countdownText = document.getElementById('countdown-text');
        const confirmBtn = document.getElementById('confirm-btn');

        const interval = setInterval(() => {
            timeLeft -= 0.1;
            
            if (timeLeft <= 0) {
                timeLeft = 0;
                clearInterval(interval);
                
                countdownText.textContent = "Ya puedes confirmar";
                confirmBtn.disabled = false;
                confirmBtn.classList.add('active');
            } else {
                countdownText.textContent = `Espera ${timeLeft.toFixed(1)}s para confirmar`;
            }
        }, 100);

        confirmBtn.addEventListener('click', () => {
            if (!confirmBtn.disabled) {
                window.location.href = TARGET_URL;
            }
        });
    </script>

</body>
</html>
