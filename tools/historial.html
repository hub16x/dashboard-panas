<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test3</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: transparent;
            color: #ffffff;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Estilo para el área de texto con scroll personalizado */
        textarea, 
        input[type="number"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        textarea:focus, 
        input[type="number"]:focus {
            background: rgba(255, 255, 255, 0.3);
            border-color: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .note {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 18px;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.15);
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #00c6ff;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Abrir Pestañas Aleatorias</h2>

        <div class="form-group">
            <label for="urls">Lista de Páginas Web (una por línea):</label>
            <textarea id="urls" placeholder="https://google.com&#10;https://youtube.com&#10;https://wikipedia.org"></textarea>
        </div>

        <div class="form-group">
            <label for="cantidad">Cantidad de pestañas a abrir:</label>
            <input type="number" id="cantidad" min="1" max="50" value="3">
        </div>

        <button onclick="abrirPestanasAleatorias()">Abrir Pestañas</button>

        <div class="note">
            ⚠️ <strong>Atención:</strong> Si no abre todas las pestañas, asegúrate de permitir las <em>ventanas emergentes (pop-ups)</em> en tu navegador.
        </div>
    </div>

    <script>
        function abrirPestanasAleatorias() {
            const textoArea = document.getElementById('urls').value;
            const cantidad = parseInt(document.getElementById('cantidad').value);

            // Separar el texto por saltos de línea y filtrar líneas vacías
            let listaUrls = textoArea
                .split('\n')
                .map(url => url.trim())
                .filter(url => url.length > 0);

            if (listaUrls.length === 0) {
                alert('Por favor, ingresa al menos una URL.');
                return;
            }

            if (isNaN(cantidad) || cantidad < 1) {
                alert('Por favor, ingresa una cantidad válida mayor a 0.');
                return;
            }

            // Normalizar las URLs agregando https:// si falta el protocolo
            listaUrls = listaUrls.map(url => {
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    return 'https://' + url;
                }
                return url;
            });

            // Abrir la cantidad especificada eligiendo elementos aleatorios
            for (let i = 0; i < cantidad; i++) {
                const indiceAleatorio = Math.floor(Math.random() * listaUrls.length);
                const urlSeleccionada = listaUrls[indiceAleatorio];
                window.open(urlSeleccionada, '_blank');
            }
        }
    </script>

</body>
</html>
