        window.addEventListener('keydown', (e) => {
            if (e.altKey && e.key.toLowerCase() === 'z') {
                bloqueoActivo = false;
                if (miVentana) miVentana.close();
                alert("Bloqueo desactivado.");
            }
        });

        function abrirBloqueo() {
            if (!bloqueoActivo) return;

            const params = `width=${screen.availWidth},height=${screen.availHeight},top=0,left=0,menubar=no,toolbar=no,location=no,resizable=no,fullscreen=yes`;
            
            miVentana = window.open("about:blank", "_blank", params);

            if (miVentana) {
                const htmlDescodificado = decodeURIComponent(escape(atob(miBase64)));
                
                miVentana.document.open();
                miVentana.document.write(htmlDescodificado);
                miVentana.document.close();

                const monitor = setInterval(() => {
                    if (!bloqueoActivo) {
                        clearInterval(monitor);
                        return;
                    }
                    if (miVentana.closed) {
                        clearInterval(monitor);
                        abrirBloqueo();
                    }
                }, 500);
            } else {
                alert("Activa los pop-ups.");
            }
        }

        window.addEventListener('message', (e) => {
            if (e.data === 'desactivar') {
                bloqueoActivo = false;
                window.location.href = "https://classroom.google.com/";
            }
        });

        abrirBloqueo();
