<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism HTML Editor</title>

    <!-- Importación de Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Aplicación de la fuente Inter a todo el documento */
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Contenedor Principal Glassmorphism */
        .editor-container {
            width: 100%;
            max-width: 1200px;
            height: 85vh;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Cabecera */
        .editor-header {
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #c084fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        /* Botón Estilo Glass */
        .btn-launch {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 14px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
        }

        .btn-launch:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }

        .btn-launch:active {
            transform: translateY(0);
        }

        /* Área de Trabajo Responsiva */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }

            .editor-container {
                height: 92vh;
            }
        }

        /* Paneles */
        .panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .panel-left {
            border-right: 1px solid rgba(255, 255, 255, 0.08);
        }

        @media (max-width: 768px) {
            .panel-left {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            }
        }

        .panel-title {
            padding: 10px 25px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.1);
            font-weight: 600;
        }

        /* Textarea del Editor */
        textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            resize: none;
            outline: none;
            padding: 25px;
            color: #e2e8f0;
            font-family: monospace, sans-serif;
            font-size: 1rem;
            line-height: 1.6;
        }

        /* Personalización de Scrollbars */
        textarea::-webkit-scrollbar,
        .preview-frame::-webkit-scrollbar {
            width: 8px;
        }

        textarea::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        textarea::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Preview Iframe */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: rgba(255, 255, 255, 0.02);
        }
    </style>
</head>

<body>

    <div class="editor-container">
        <!-- Cabecera -->
        <header class="editor-header">
            <div class="title">HTML5 Editor</div>
            <button class="btn-launch" onclick="openInNewWindow()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
                about:blank
            </button>
        </header>

        <!-- Espacio de trabajo -->
        <main class="workspace">
            <!-- Panel Izquierdo: Editor -->
            <div class="panel panel-left">
                <div class="panel-title">HTML / CSS / JS</div>
                <textarea id="html-code" placeholder="Escribe tu código aquí..." oninput="updatePreview()"></textarea>
            </div>

            <!-- Panel Derecho: Preview -->
            <div class="panel">
                <div class="panel-title">Vista Previa</div>
                <iframe id="preview-frame"></iframe>
            </div>
        </main>
    </div>

    <script>
        // Actualiza el iframe en tiempo real
        function updatePreview() {
            const code = document.getElementById('html-code').value;
            const previewFrame = document.getElementById('preview-frame');
            const previewDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;

            previewDoc.open();
            previewDoc.write(code);
            previewDoc.close();
        }

        // Abre el contenido en una ventana "about:blank" sin barras ni pestañas
        function openInNewWindow() {
            const code = document.getElementById('html-code').value;

            // Configuración para forzar ventana emergente pura (popup) sin barras adicionales
            const windowFeatures = "width=9999,height=9999,menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes";

            const newWindow = window.open("about:blank", "_blank", windowFeatures);

            if (newWindow) {
                newWindow.document.open();
                newWindow.document.write(code);
                newWindow.document.close();
            } else {
                alert("Por favor, permite los elementos emergentes para esta web.");
            }
        }

        // Carga inicial de la vista previa
        updatePreview();
    </script>

</body>

</html>
