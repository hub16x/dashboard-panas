<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Pestañas Múltiples</title>
    <style>
        /* El fondo del body se mantiene transparente para aprovechar allowtransparency */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: transparent;
            color: #ffffff;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Contenedor estilo Cristal (Glassmorphism) */
        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Campos de entrada estilizados */
        input[type="text"], 
        input[type="number"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        input[type="text"]:focus, 
        input[type="number"]:focus {
            background: rgba(255, 255, 255, 0.3);
            border-color: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }

        /* Botón de acción con degradado */
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        /* Nota informativa */
        .note {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 18px;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.15);
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #00c6ff;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Abrir Pestañas</h2>

        <div class="form-group">
            <label for="url">Dirección Web (URL)</label>
            <input type="text" id="url" placeholder="https://www.ejemplo.com" value="https://www.google.com">
        </div>

        <div class="form-group">
            <label for="cantidad">Cantidad de pestañas</label>
            <input type="number" id="cantidad" min="1" max="50" value="40">
        </div>

        <button onclick="abrirPestanas()">Abrir Pestañas</button>

        <div class="note">
            ⚠️ <strong>Atención:</strong> Si no abre todas las pestañas, asegúrate de permitir las <em>ventanas emergentes (pop-ups)</em> en la barra de direcciones de tu navegador.
        </div>
    </div>

    <script>
        function abrirPestanas() {
            let url = document.getElementById('url').value.trim();
            const cantidad = parseInt(document.getElementById('cantidad').value);

            if (!url) {
                alert('Por favor, ingresa una URL válida.');
                return;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            if (isNaN(cantidad) || cantidad < 1) {
                alert('Por favor, ingresa una cantidad válida mayor a 0.');
                return;
            }

            for (let i = 0; i < cantidad; i++) {
                window.open(url, '_blank');
            }
        }
    </script>

</body>
</html>
